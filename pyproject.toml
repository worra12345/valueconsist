[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "worra12345-valueconsist"
version = "0.1.0"
description = "把输入按语义边界切成独立单元，逐单元核对模型价值观的跨轮一致性相关的特征并标出命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "worra12345" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://worra12345.github.io"
Repository = "https://github.com/worra12345/valueconsist"
Issues = "https://github.com/worra12345/valueconsist/issues"

[project.scripts]
valueconsist = "valueconsist:main"

[tool.setuptools]
py-modules = ["valueconsist"]
